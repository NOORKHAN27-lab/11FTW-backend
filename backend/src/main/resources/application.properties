# ============================================================================
# 11FTW backend configuration
# Copy this file's placeholders with your real values before running.
# For local dev, easiest is to export these as environment variables
# (see SETUP_GUIDE.md) rather than editing this file directly — keeps
# secrets out of git.
# ============================================================================

server.port=8080

# ---------- Database ----------
# Local Postgres example: createdb elevenftw
 spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
 spring.datasource.username=${PGUSER}
 spring.datasource.password=${PGPASSWORD}

# Schema is now managed by Flyway (see src/main/resources/db/migration) —
# 'validate' just checks the DB matches what Flyway migrated, it never
# changes anything itself. baseline-on-migrate lets Flyway adopt an
# existing database (e.g. one an older version of this app created with
# ddl-auto=update) as if it were already at V1, instead of erroring.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# ---------- Auth ----------
# Generate a random 64+ character string for local dev, e.g.:
#   openssl rand -base64 48
app.jwt.secret=${JWT_SECRET:replace-this-with-a-long-random-string-before-running}
# Access token — short-lived on purpose; the frontend silently exchanges it
# for a new one via /api/auth/refresh using the longer-lived refresh token.
app.jwt.expiration-ms=900000
# Refresh token — default 30 days.
app.refresh-token.expiration-ms=2592000000

# Auth endpoint rate limiting (per IP, per endpoint, in-memory — see RateLimitFilter).
app.rate-limit.max-requests=10
app.rate-limit.window-seconds=60

# From Google Cloud Console -> APIs & Services -> Credentials -> OAuth 2.0 Client ID
app.google.client-id=${GOOGLE_CLIENT_ID:your-google-oauth-client-id.apps.googleusercontent.com}

# From Google Cloud Console -> APIs & Services -> Credentials -> API Key
# (Enable the "Geocoding API" for this key)
app.google.maps-api-key=${GOOGLE_MAPS_API_KEY:your-google-maps-api-key}

# ---------- Email/password auth ----------
# SMTP settings used to send "forgot password" reset links. Any SMTP provider
# works (Gmail app password, SendGrid, Mailgun, etc.) — plug in its host/port/
# credentials here. Without these set, sign-up/login/password-reset accounts
# still work, but forgot-password emails will silently fail to send (logged,
# not thrown — see AuthService#forgotPassword for why).
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:no-reply@11ftw.app}

# Where the frontend runs — used to build the link inside password-reset emails.
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# ---------- CORS ----------
# Must match wherever `npm run dev` serves the React app.
app.cors.allowed-origin=${CORS_ORIGIN:http://localhost:5173}

# ---------- Error monitoring ----------
# Optional — leave blank for local dev (Sentry simply doesn't activate with
# no DSN). Get a free DSN at sentry.io, or self-host, then set it for
# staging/production.
sentry.dsn=${SENTRY_DSN:}
sentry.traces-sample-rate=0.1
sentry.environment=${SENTRY_ENVIRONMENT:development}

# ---------- Health check ----------
# Only "health" is exposed over HTTP (not env, beans, etc.) — and with no
# authenticated principal, it returns just {"status":"UP"}, no DB/disk
# details, so it's safe to leave permitAll() for monitors like UptimeRobot.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized

# ---------- Weekly email digest ----------
# Cron: every Monday 9am server time by default.
app.digest.cron=${DIGEST_CRON:0 0 9 * * MON}

# ---------- API docs (Swagger UI at /swagger-ui.html) ----------
# Set to false in a production profile if you don't want the API surface publicly browsable.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
